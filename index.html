<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flor Amarilla</title>
<style>
body {
    margin: 0; background: #0a0802; color: #FFD700;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden; font-family: 'Courier New', monospace;
    position: relative; user-select: none;
}
body::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(120, 90, 10, 0.4) 0%, rgba(5, 5, 5, 1) 70%);
    animation: pulse-bg 5s infinite alternate ease-in-out;
    animation-play-state: paused;
    z-index: -1;
}
@keyframes pulse-bg { 0% { opacity: 0.7; } 100% { opacity: 1; } }
.container { display: flex; flex-direction: column; align-items: center; z-index: 1; }
.flower-wrapper {
    margin-bottom: 20px;
    animation: medal-glow 3s infinite alternate ease-in-out;
    animation-play-state: paused;
}
@keyframes medal-glow {
    0% { filter: drop-shadow(0 0 5px #B8860B) drop-shadow(0 0 10px #DAA520) brightness(0.9); }
    100% { filter: drop-shadow(0 0 10px #FFD700) drop-shadow(0 0 20px #FFA500) brightness(1.2); }
}
pre { margin: 0; white-space: pre; line-height: 1.1; font-size: clamp(4px, 1vw, 10px); font-weight: bold; }
.char {
    display: inline-block;
    animation: pixel-wave 1.2s infinite steps(3);
    animation-delay: var(--wave-delay, 0s);
    animation-play-state: paused;
}
@keyframes pixel-wave { 0%, 100% { transform: translateY(0); } 33% { transform: translateY(-1.5px); } 66% { transform: translateY(1.5px); } }

.effects-active body::before,
body.effects-active::before {
    animation-play-state: running;
}
.effects-active .flower-wrapper,
.effects-active .char {
    animation-play-state: running;
}
.main-message {
    height: 30px; color: #fff; font-size: clamp(16px, 4vw, 24px); letter-spacing: 2px;
    text-align: center; transition: all 1.5s ease;
}
.main-message.glow { color: #FFFACD; text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500; }
.secret {
    margin-top: 15px; color: rgba(255, 215, 0, 0.6); font-size: clamp(11px, 2.5vw, 14px);
    letter-spacing: 1px; opacity: 0; transition: opacity 2s ease; text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); height: 20px;
}
.secret.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
    <div class="flower-wrapper"><pre id="flower"></pre></div>
    <div class="main-message" id="main-message"></div>
    <div class="secret" id="secret">Una flor para otra flor, que tengas un lindo dia ;)</div>
</div>

<script>
const art = document.getElementById('ascii-art').textContent.replace(/^\n/, '');
const flowerEl = document.getElementById("flower");
const mainMessageEl = document.getElementById("main-message");
const secretEl = document.getElementById("secret");

const finalTargetText = "Te deseo un feliz día <3";
const hackerChars = "JAHARIET!@#$%&*<>M00Npapupro";

let index = 0;
const chars = Array.from(art);
const CHARS_PER_FRAME = 90;

// The flower is built incrementally instead of recreating the entire innerHTML
// on every frame. This avoids repeatedly parsing an increasingly large string.
function typeASCII() {
    const fragment = document.createDocumentFragment();
    const limit = Math.min(index + CHARS_PER_FRAME, chars.length);

    for (; index < limit; index++) {
        const char = chars[index];

        if (char === ' ' || char === '\n') {
            fragment.appendChild(document.createTextNode(char));
        } else {
            const span = document.createElement('span');
            span.className = 'char';
            span.textContent = char;
            span.style.setProperty('--wave-delay', `${-(index % 25) * 0.1}s`);
            fragment.appendChild(span);
        }
    }

    flowerEl.appendChild(fragment);

    if (index < chars.length) {
        requestAnimationFrame(typeASCII);
    } else {
        // Only now enable the continuous effects.
        document.body.classList.add('effects-active');
        setTimeout(startHackerDecoding, 300);
    }
}

function startHackerDecoding() {
    let iteration = 0;
    const interval = setInterval(() => {
        let currentText = finalTargetText.split('').map((char, i) => {
            if (i < iteration) return char;
            if (i < iteration + 4 && char !== ' ') {
                return hackerChars[Math.floor(Math.random() * hackerChars.length)];
            }
            return '';
        }).join('');

        mainMessageEl.innerHTML = currentText + '<span style="animation: blink 0.8s infinite step-end">_</span>';

        if (iteration >= finalTargetText.length) {
            clearInterval(interval);
            mainMessageEl.innerHTML = finalTargetText;
            mainMessageEl.classList.add('glow');
            setTimeout(() => secretEl.classList.add('show'), 3500);
        }
        iteration += 0.7; 
    }, 45);
}

window.onload = () => requestAnimationFrame(typeASCII);
</script>
